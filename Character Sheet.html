<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Sealed Character Sheet</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=IBM+Plex+Mono:wght@500;600&family=IM+Fell+English:ital@0;1&display=swap">
<style>
/* Layout: a sealed envelope. One narrow column, ten folds (I to X) in a sticky strip, and a wax seal that holds the code at the end. */
:root {
  --paper: #eceef3; --card: #fafbfd; --ink: #1c1b28; --ink-2: #585669; --line: #d6d5df;
  --wax: #7a1d33; --wax-ink: #fff6f8; --wax-soft: #f2e3e7; --brass: #7f6428; --good: #2b7650; --bad: #ad3127;
  --display: "IM Fell English", "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
  --body: "Atkinson Hyperlegible", "Segoe UI", system-ui, -apple-system, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --r: 10px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #111018; --card: #1a1924; --ink: #ebe9f2; --ink-2: #a6a3b6; --line: #2e2c3c;
    --wax: #d8657d; --wax-ink: #22080f; --wax-soft: #3a1a24; --brass: #cdae6b; --good: #58c08d; --bad: #ff8573; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #111018; --card: #1a1924; --ink: #ebe9f2; --ink-2: #a6a3b6; --line: #2e2c3c;
  --wax: #d8657d; --wax-ink: #22080f; --wax-soft: #3a1a24; --brass: #cdae6b; --good: #58c08d; --bad: #ff8573; color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--paper); color: var(--ink); font: 16px/1.55 var(--body); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--card); }
.wrap { max-width: 640px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 0 128px; }
h1, h2, .display { font-family: var(--display); font-weight: 400; text-wrap: balance; }
h1 { font-size: 2.35rem; line-height: 1.05; margin: 22px 0 10px; }
h2 { font-size: 1.75rem; line-height: 1.1; margin: 18px 0 6px; }
h3 { font-size: .76rem; text-transform: uppercase; letter-spacing: .16em; color: var(--ink-2); margin: 24px 0 8px; font-weight: 700; }
p { margin: 0 0 10px; max-width: 62ch; }
.muted { color: var(--ink-2); }
.small { font-size: .88rem; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--wax); outline-offset: 2px; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

/* header */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--card); border-bottom: 1px solid var(--line); }
.top-in { max-width: 640px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 10px; display: flex; align-items: center; gap: 10px; }
.brand { font-family: var(--display); font-size: 1.15rem; white-space: nowrap; display: flex; align-items: center; gap: 8px; }
.brand i { width: 12px; height: 12px; border-radius: 50%; background: var(--wax); display: inline-block; box-shadow: 0 0 0 3px var(--wax-soft); }
.saved { margin-left: auto; font-size: .78rem; color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.steps { max-width: 640px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 0 10px; display: grid; grid-template-columns: repeat(10, minmax(0, 1fr)); gap: 3px; }
.steps button { border: 0; background: var(--paper); border-radius: 6px; padding: 5px 0 3px; font-family: var(--display); font-size: .92rem; color: var(--ink-2); cursor: pointer; min-width: 0; }
.steps button.done { color: var(--wax); }
.steps button.on { background: var(--wax); color: var(--wax-ink); }
.steps button:disabled { opacity: .35; cursor: default; }

/* controls */
.panel { background: var(--card); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; margin-top: 14px; }
.field { display: grid; gap: 6px; margin-bottom: 16px; }
.field:last-child { margin-bottom: 0; }
.field label, .lbl { font-weight: 700; font-size: .92rem; }
.hint { font-size: .84rem; color: var(--ink-2); }
input[type=text], input[type=number], textarea, select { width: 100%; background: var(--paper); border: 1px solid var(--line); border-radius: 8px; padding: 11px 12px; min-width: 0; }
textarea { min-height: 84px; resize: vertical; }
input:focus, textarea:focus, select:focus { border-color: var(--wax); outline: none; }
.row { display: flex; gap: 10px; flex-wrap: wrap; }
.row > * { flex: 1 1 140px; min-width: 0; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { border: 1px solid var(--line); background: var(--card); border-radius: 999px; padding: 8px 13px; cursor: pointer; font-size: .92rem; }
.chip.on { background: var(--wax); border-color: var(--wax); color: var(--wax-ink); font-weight: 700; }
.chip.veil { border-style: dashed; border-color: var(--wax); background: var(--wax-soft); }
.chip.line { background: var(--wax); border-color: var(--wax); color: var(--wax-ink); }
.chip .tag { font-size: .72rem; text-transform: uppercase; letter-spacing: .1em; margin-left: 6px; opacity: .85; }
.btn { border: 1px solid var(--line); background: var(--card); border-radius: 10px; padding: 12px 16px; cursor: pointer; font-weight: 700; }
.btn.primary { background: var(--wax); border-color: var(--wax); color: var(--wax-ink); }
.btn.ghost { background: transparent; }
.btn:disabled { opacity: .45; cursor: default; }
.pick { display: grid; gap: 10px; }
.opt { text-align: left; border: 1px solid var(--line); background: var(--card); border-radius: var(--r); padding: 13px 14px; cursor: pointer; display: grid; gap: 3px; }
.opt.on { border-color: var(--wax); box-shadow: inset 0 0 0 2px var(--wax); background: var(--wax-soft); }
.opt .t { display: flex; justify-content: space-between; gap: 10px; align-items: baseline; flex-wrap: wrap; }
.opt .n { font-family: var(--display); font-size: 1.25rem; line-height: 1.15; }
.opt .b { font-family: var(--mono); font-size: .76rem; color: var(--brass); white-space: nowrap; }
.opt .w { font-style: italic; font-size: .95rem; }
.opt .d { font-size: .9rem; color: var(--ink-2); }
.answers .opt { padding: 11px 14px; }
.answers .opt .n { font-family: var(--body); font-size: 1rem; }
.q { margin-top: 22px; }
.q .qn { font-family: var(--display); font-size: 1.35rem; line-height: 1.2; margin: 0 0 10px; display: flex; gap: 10px; align-items: baseline; }
.q .qn span { font-size: .95rem; color: var(--wax); }

/* abilities */
.abil { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--line); }
.abil:last-child { border-bottom: 0; }
.abil .nm b { display: block; }
.abil .nm span { font-size: .82rem; color: var(--ink-2); }
.abil .ctl { display: flex; align-items: center; gap: 8px; }
.abil select { width: 76px; padding: 8px; }
.stepper { display: flex; align-items: center; gap: 6px; }
.stepper button { width: 38px; height: 38px; border-radius: 8px; border: 1px solid var(--line); background: var(--paper); font-size: 1.1rem; cursor: pointer; }
.stepper output { min-width: 26px; text-align: center; font-family: var(--mono); font-weight: 600; }
.mod { font-family: var(--mono); font-size: .85rem; color: var(--ink-2); min-width: 44px; text-align: right; font-variant-numeric: tabular-nums; }
.budget { font-family: var(--mono); font-weight: 600; }
.budget.over { color: var(--bad); }

/* look */
.sw { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.sw button { width: 34px; height: 34px; border-radius: 50%; border: 2px solid var(--line); cursor: pointer; padding: 0; }
.sw button.on { border-color: var(--wax); box-shadow: 0 0 0 3px var(--card), 0 0 0 5px var(--wax); }
.sw input[type=color] { width: 44px; height: 36px; border: 1px solid var(--line); border-radius: 8px; background: var(--paper); padding: 2px; }
.sw .hex { font-family: var(--mono); font-size: .8rem; color: var(--ink-2); }
input[type=range] { width: 100%; accent-color: var(--wax); }
.height-read { font-family: var(--mono); font-weight: 600; }
.ref { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
.ref img { width: 88px; height: 88px; object-fit: cover; border-radius: 8px; border: 1px solid var(--line); }
.preview { display: flex; gap: 14px; align-items: center; }
.preview .fig { width: 64px; height: 84px; border-radius: 8px; background: var(--paper); border: 1px solid var(--line); display: grid; place-items: center; flex: none; overflow: hidden; }
.preview .fig svg { width: 48px; height: 64px; }

/* the calling card */
.card { position: relative; border: 1px solid var(--line); border-radius: 12px; background: var(--card); padding: 18px 18px 16px; display: grid; grid-template-columns: 72px minmax(0, 1fr); gap: 14px; }
.card .fig { width: 72px; height: 92px; border-radius: 8px; background: var(--paper); border: 1px solid var(--line); display: grid; place-items: center; overflow: hidden; }
.card .fig img { width: 100%; height: 100%; object-fit: cover; }
.card .fig svg { width: 52px; height: 70px; }
.card .side { display: grid; justify-items: center; align-content: start; }
.card .side .seal { margin-top: -18px; margin-left: 34px; }
.card .name { font-family: var(--display); font-size: 1.6rem; line-height: 1.05; }
.card .meta { color: var(--ink-2); font-size: .9rem; }
.card .tagline { position: absolute; top: 10px; left: 18px; font-family: var(--mono); font-size: .66rem; text-transform: uppercase; letter-spacing: .14em; color: var(--ink-2); }
.card.example { padding-top: 32px; }
.stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; margin-top: 12px; }
.stat { background: var(--paper); border-radius: 8px; padding: 7px 4px; text-align: center; }
.stat b { display: block; font-family: var(--mono); font-size: 1.1rem; font-variant-numeric: tabular-nums; }
.stat span { font-size: .68rem; text-transform: uppercase; letter-spacing: .12em; color: var(--ink-2); }
@media (max-width: 380px) { .card { grid-template-columns: 1fr; } .card .side { display: none; } }

/* wax seal */
.seal { flex: none; width: 52px; height: 52px; border-radius: 50%; display: grid; place-items: center; font-family: var(--display); font-size: 1.35rem; color: var(--wax-ink);
  background: radial-gradient(circle at 35% 30%, color-mix(in srgb, var(--wax) 70%, white) 0, var(--wax) 45%, color-mix(in srgb, var(--wax) 75%, black) 100%);
  box-shadow: 0 0 0 4px color-mix(in srgb, var(--wax) 35%, transparent), 0 2px 6px color-mix(in srgb, var(--ink) 30%, transparent); transform: rotate(-8deg); }
.seal.big { width: 88px; height: 88px; font-size: 2.1rem; }
.seal.unset { background: var(--paper); color: var(--ink-2); box-shadow: inset 0 0 0 2px var(--line); }
.sealrow { display: flex; gap: 18px; align-items: center; margin: 10px 0 14px; padding-left: 8px; }
.sealrow p { margin: 0; }

/* code */
.code { width: 100%; font-family: var(--mono); font-size: .76rem; word-break: break-all; min-height: 110px; background: var(--paper); }
.note { border-left: 3px solid var(--wax); padding: 9px 12px; background: var(--wax-soft); border-radius: 0 8px 8px 0; font-size: .92rem; }
.err { color: var(--bad); font-size: .9rem; }
.ok { color: var(--good); font-size: .9rem; }
ul.know { margin: 6px 0 0; padding-left: 20px; display: grid; gap: 6px; }

/* sheet view */
.sheet-head { display: flex; gap: 12px; align-items: center; justify-content: space-between; flex-wrap: wrap; margin-top: 10px; }
.sheet-head > div { min-width: 0; }
.vitals { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.vital { background: var(--paper); border-radius: 10px; padding: 10px 6px; text-align: center; }
.vital b { display: block; font-family: var(--mono); font-size: 1.3rem; font-variant-numeric: tabular-nums; }
.vital span { font-size: .7rem; text-transform: uppercase; letter-spacing: .1em; color: var(--ink-2); }
.abgrid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.ab { background: var(--paper); border-radius: 10px; padding: 8px; text-align: center; }
.ab .s { font-size: .72rem; letter-spacing: .14em; color: var(--ink-2); }
.ab .m { font-family: var(--mono); font-size: 1.3rem; font-weight: 600; }
.ab .v { font-family: var(--mono); font-size: .76rem; color: var(--ink-2); }
.ab .v .sv.prof { color: var(--wax); font-weight: 600; }
.li { display: flex; justify-content: space-between; gap: 10px; padding: 7px 0; border-bottom: 1px dashed var(--line); font-size: .95rem; }
.li:last-child { border-bottom: 0; }
.li .v { font-family: var(--mono); font-variant-numeric: tabular-nums; white-space: nowrap; }
.li .k { min-width: 0; }
.li.prof .k::before { content: "\25CF"; color: var(--wax); margin-right: 6px; font-size: .7rem; }
.feat { padding: 10px 0; border-bottom: 1px solid var(--line); }
.feat:last-child { border-bottom: 0; }
.feat .h { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
.feat .h b { font-size: 1rem; }
.feat .lv { font-family: var(--mono); font-size: .72rem; color: var(--ink-2); white-space: nowrap; }
.feat p { font-size: .92rem; color: var(--ink-2); margin: 3px 0 0; }
.nav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; background: var(--card); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); }
.nav-in { max-width: 640px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 10px; display: flex; gap: 10px; align-items: center; }
.nav-in .msg { flex: 1; font-size: .84rem; color: var(--ink-2); min-width: 0; }
details.more { margin-top: 14px; }
details.more summary { cursor: pointer; font-weight: 700; }
</style>

<header class="top">
  <div class="top-in">
    <div class="brand"><i aria-hidden="true"></i>Character sheet</div>
    <span class="saved" id="savedNote"></span>
  </div>
  <nav class="steps" id="steps" aria-label="Steps"></nav>
</header>

<main class="wrap" id="app"></main>

<div class="nav" id="nav">
  <div class="nav-in">
    <button class="btn ghost" id="backBtn" type="button">Back</button>
    <span class="msg" id="navMsg"></span>
    <button class="btn primary" id="nextBtn" type="button">Next</button>
  </div>
</div>

<script>

          { id: 'sour', name: 'Sour Note', cost: 0, level: 1, text: 'One creature within 60 ft makes a WIS save or takes 1d6 thunder damage and has disadvantage on its next attack (2d6 at level 5).' },

          { id: 'sleep', name: 'Sleep Powder', cost: 2, level: 1, text: 'Up to three creatures within 60 ft with 20 HP or fewer make a WIS save or fall asleep for 1 minute (they wake if damaged).' },
          { id: 'step', name: 'Vanishing Step', cost: 2, level: 2, text: 'Bonus action: vanish and reappear up to 30 ft away in a spot you can see.' },
          { id: 'mirror', name: 'Mirror Images', cost: 2, level: 3, text: 'Three illusory copies surround you for 1 minute. When something attacks you, roll a d20: on 11 or higher it hits a copy instead, which vanishes.' },
          { id: 'vanish', name: 'Vanish', cost: 2, level: 3, text: 'Become invisible for up to 1 minute, until you attack or use a trick.' },

        ]
      },
      features: [
        { level: 1, name: 'Tricks', text: 'You can use any trick on your list whose level you have reached. Tricks that cost points use Trick Points: 2 × your level, refilled on a long rest.' },
        { level: 2, name: 'Second Sight', text: "You see through illusions, disguises and glamours within 30 ft. You know they're fake, and you see what's underneath." },
        { level: 3, name: 'Deeper Tricks', text: 'Mirror Images and Vanish join your list.' },
        { level: 4, ...BOOST },
        { level: 5, name: 'Black Blizzard', text: 'Black Blizzard joins your list, and Hex Bolt deals 2d10.' }
      ]
    }
  ];

  const WEAPONS = [
    { id: 'sabre', name: 'Sabre', damage: '1d8', type: 'slashing', props: ['Versatile: 1d10 with two hands'], versatile: '1d10' },
    { id: 'rapier', name: 'Rapier', damage: '1d8', type: 'piercing', props: ['Finesse: use STR or DEX'], finesse: true },
    { id: 'spear', name: 'Spear', damage: '1d8', type: 'piercing', props: ['Thrown 20/60 ft'] },
    { id: 'knives', name: 'Twin knives', damage: '1d4', type: 'piercing', props: ['Finesse', 'Thrown 20/60 ft', 'Bonus action: attack with the second knife (no modifier on its damage)'], finesse: true, noShield: true },
    { id: 'hammer', name: 'Hammer', damage: '1d8', type: 'bludgeoning', props: ['Versatile: 1d10 with two hands'], versatile: '1d10' },
    { id: 'axe', name: 'Great axe', damage: '1d12', type: 'slashing', props: ['Two-handed'], twoHanded: true },
    { id: 'bow', name: 'Bow', damage: '1d8', type: 'piercing', props: ['Range 150/600 ft', 'Two-handed'], ranged: true, twoHanded: true }
  ];

  // What a character does for a living. No mechanics.
  const ROLES = ['Soldier', 'Nurse', 'Governess', 'Musician', 'Dancer', 'Actor', 'Stage magician', 'Servant', 'Cook', 'Doctor', 'Gamekeeper', 'Pickpocket', 'Seamstress', 'Coachman', 'Student', 'Priest', 'Journalist'];

  // A small thing the character always carries.
  const KEEPSAKES = ['Hatpin', 'Pocket watch', 'Walking stick', 'Locket', 'Sewing scissors', 'Pipe', 'Letter opener', 'Folding fan', 'Hair comb', 'Tuning fork', 'Lucky coin', 'Penknife'];

  // Four strange questions. The option ids are deliberately meaningless: the
  // scoring lives only in the DM's app.
  const QUESTIONS = [
    {
      id: 'q1', text: 'When you were small, what did you love most?', options: [
        { id: 'a', text: 'Hiding in small places nobody else could fit' },
        { id: 'b', text: 'Spinning until the room tipped over' },
        { id: 'c', text: 'Staying awake, listening to the house at night' },
        { id: 'd', text: 'Dressing up as somebody else' },
        { id: 'e', text: 'Marching, and anything with a drum' },
        { id: 'f', text: 'One blanket I carried everywhere until it fell apart' },
        { id: 'g', text: 'Jumping out at people' },
        { id: 'h', text: 'The kitchen, and whoever let me lick the spoon' },
        { id: 'i', text: 'A little light left on so I could fall asleep' },
        { id: 'j', text: 'Staying outside in the cold long after everyone went in' }
      ]
    },
    {
      id: 'q2', text: 'When something frightens you, what do you do?', options: [
        { id: 'a', text: 'Get between it and someone smaller' },
        { id: 'b', text: "Keep moving. Never be where it's looking." },
        { id: 'c', text: 'Go at it before it comes at me' },
        { id: 'd', text: 'Hold on to someone until it passes' },
        { id: 'e', text: 'Go very quiet and watch it' },
        { id: 'f', text: "Laugh. I can't help it." },
        { id: 'g', text: 'Go cold. Nothing reaches me.' },
        { id: 'h', text: 'Talk to it. Make friends with it, if I can.' },
        { id: 'i', text: 'Turn on every light in the house' },
        { id: 'j', text: 'Make myself small and wait' }
      ]
    },
    {
      id: 'q3', text: 'Which sound would you miss most if you never heard it again?', options: [
        { id: 'a', text: 'A drum, a long way off' },
        { id: 'b', text: 'A tune that slows down right at the end' },
        { id: 'c', text: 'A sudden bang, and then everyone laughing' },
        { id: 'd', text: 'A rocking chair creaking in the next room' },
        { id: 'e', text: 'A clock ticking in a dark house' },
        { id: 'f', text: 'Applause' },
        { id: 'g', text: 'The hush when snow is falling' },
        { id: 'h', text: "An oven door, and someone saying “careful, it's hot”" },
        { id: 'i', text: 'A match being struck' },
        { id: 'j', text: 'Whispering under the covers after lights-out' }
      ]
    },
    {
      id: 'q4', text: 'Pick a word.', options: [
        { id: 'a', text: 'Duty' }, { id: 'b', text: 'Grace' }, { id: 'c', text: 'Surprise' }, { id: 'd', text: 'Mended' },
        { id: 'e', text: 'Vigil' }, { id: 'f', text: 'Mask' }, { id: 'g', text: 'Frost' }, { id: 'h', text: 'Home' },
        { id: 'i', text: 'Hope' }, { id: 'j', text: 'Hidden' }
      ]
    }
  ];

  // Things a player may not want to meet in a game. A broad, ordinary list.
  const COMFORT_TOPICS = [
    'Spiders', 'Insects', 'Rats and mice', 'Snakes', 'Dogs and wolves', 'Blood', 'Gore and injury detail', 'Body horror',
    'Needles', 'Dolls and puppets', 'Clowns', 'Masks', 'Drowning', 'Fire', 'Heights', 'Being trapped or buried', 'Darkness',
    'Ghosts and possession', 'Harm to children', 'Harm to animals', 'Death of a loved one', 'Illness and disease',
    'Food and eating', 'Losing control of your mind', 'Kidnapping', 'Torture', 'Sexual content'
  ];

  // ---------------------------------------------------------------- helpers
  const mod = score => Math.floor(((score || 10) - 10) / 2);
  const profBonus = level => (level >= 5 ? 3 : 2);
  const find = (list, id) => list.find(x => x.id === id) || null;
  const sign = v => (v >= 0 ? '+' + v : '−' + Math.abs(v));

  // `extra` is an optional { bonus: [ability +2, ability +1] } granted during play.
  function finalScores(ch, extra) {
    const s = {};
    for (const a of ABILITIES) s[a.id] = (ch.abilities && ch.abilities[a.id]) || 10;
    if (extra && extra.bonus) { s[extra.bonus[0]] += 2; s[extra.bonus[1]] += 1; }
    for (const [k, v] of Object.entries(ch.boosts || {})) if (s[k] != null) s[k] += v;
    for (const a of ABILITIES) s[a.id] = Math.min(20, s[a.id]);
    return s;
  }

  function usesCount(u, ch, scores) {
    if (!u) return 0;
    const lvl = (ch && ch.level) || 1;
    if (u.k === 'fixed') return u.n;
    if (u.k === 'prof') return profBonus(lvl);
    if (u.k === 'mod') return Math.max(u.min != null ? u.min : 0, mod(scores ? scores[u.ability] : 10));
    if (u.k === 'level') return lvl * (u.mult || 1) + (u.plus || 0);
    return 0;
  }

  function songsAllowed(level) { return level >= 5 ? 4 : level >= 3 ? 3 : 2; }

  function derive(ch, extra) {
    const level = Math.max(1, Math.min(MAX_LEVEL, ch.level || 1));
    const path = find(PATHS, ch.path) || PATHS[0];
    const scores = finalScores(ch, extra);
    const m = {}; for (const a of ABILITIES) m[a.id] = mod(scores[a.id]);
    const prof = profBonus(level);
    const weapon = find(WEAPONS, ch.weapon && ch.weapon.type) || WEAPONS[0];
    const shield = !!(path.shield && ch.weapon && ch.weapon.shield !== false && !weapon.twoHanded && !weapon.noShield);
    const ar = path.armor;
    let ac = ar.kind === 'heavy' ? ar.base : ar.kind === 'medium' ? ar.base + Math.min(ar.dexMax != null ? ar.dexMax : 2, m.dex) : ar.base + m.dex;
    if (shield) ac += 2;
    if (path.id === 'soldier' && ch.choice === 'guardian') ac += 1;
    const perLevel = Math.max(1, Math.floor(path.hitDie / 2) + 1 + m.con);
    const hp = Math.max(1, path.hitDie + m.con) + (level - 1) * perLevel;
    const profSet = new Set(ch.skills || []), expSet = new Set(ch.expertise || []);
    const skillMods = {};
    for (const s of SKILLS) {
      let v = m[s.ability];
      if (profSet.has(s.id) && expSet.has(s.id)) v += prof * 2;
      else if (profSet.has(s.id)) v += prof;
      else if (path.id === 'performer' && level >= 2) v += Math.floor(prof / 2);
      skillMods[s.id] = v;
    }
    const saveMods = {};
    for (const a of ABILITIES) saveMods[a.id] = m[a.id] + (path.saves.includes(a.id) ? prof : 0);
    const atkAbility = weapon.ranged ? 'dex' : weapon.finesse ? (m.dex >= m.str ? 'dex' : 'str') : 'str';
    let attack = m[atkAbility] + prof;
    if (weapon.ranged && path.id === 'huntsman' && level >= 2) attack += 2;
    if (weapon.ranged && path.id === 'soldier' && ch.choice === 'marksman') attack += 2;
    let dmgBonus = m[atkAbility];
    if (path.id === 'soldier' && ch.choice === 'duelist' && !weapon.twoHanded && !weapon.ranged) dmgBonus += 2;
    const giftAbility = extra && extra.bonus ? extra.bonus[0] : null;
    const powerAbility = path.power ? path.power.ability : null;
    return {
      level, path, scores, mods: m, prof, ac, hp, speed: 30, hitDice: `${level}d${path.hitDie}`,
      initiative: m.dex, passivePerception: 10 + skillMods.perception,
      skillMods, saveMods, weapon, shield,
      attack: { bonus: attack, ability: atkAbility, damage: `${weapon.damage}${dmgBonus ? (dmgBonus > 0 ? '+' : '−') + Math.abs(dmgBonus) : ''} ${weapon.type}`, dmgBonus },
      giftDC: giftAbility ? 8 + prof + m[giftAbility] : null,
      giftAttack: giftAbility ? prof + m[giftAbility] : null,
      powerDC: powerAbility ? 8 + prof + m[powerAbility] : null,
      powerAttack: powerAbility ? prof + m[powerAbility] : null,
      points: path.points ? { name: path.points.name, max: usesCount(path.points.formula, { level }, scores), per: path.points.per } : null,
      songsAllowed: path.id === 'performer' ? songsAllowed(level) : 0
    };
  }

  // Turn the text of a roll heading ("Wisdom (Perception)", "Dexterity save",
  // "Nerve save", "Initiative") into a modifier for one character.
  function checkModifier(ch, check, extra) {
    const d = derive(ch, extra);
    const text = String(check || '').toLowerCase();
    if (/\bnerve\b/.test(text)) return { mod: d.saveMods.wis, label: 'Nerve save (WIS)', kind: 'save', ability: 'wis' };
    const skill = SKILLS.find(s => text.includes(s.name.toLowerCase()));
    const ability = ABILITIES.find(a => text.includes(a.name.toLowerCase()) || new RegExp('\\b' + a.short.toLowerCase() + '\\b').test(text));
    if (/\bsav(e|es|ing)\b/.test(text) && ability) return { mod: d.saveMods[ability.id], label: ability.name + ' save', kind: 'save', ability: ability.id };
    if (skill) return { mod: d.skillMods[skill.id], label: (ability ? ability.name + ' ' : '') + '(' + skill.name + ')', kind: 'skill', skill: skill.id, ability: skill.ability };
    if (/initiative/.test(text)) return { mod: d.initiative, label: 'Initiative', kind: 'initiative', ability: 'dex' };
    if (/attack/.test(text)) return { mod: d.attack.bonus, label: 'Attack', kind: 'attack' };
    if (ability) return { mod: d.mods[ability.id], label: ability.name, kind: 'ability', ability: ability.id };
    return { mod: 0, label: 'd20', kind: 'flat' };
  }

  // A blank character, as the sheet and the app both expect it.
  function blankCharacter() {
    return {
      kind: 'stagehand-character', v: 1, id: 'c' + Math.random().toString(36).slice(2, 10),
      player: '', name: '', pronouns: '', age: '', role: '',
      path: null, level: 1,
      abilityMethod: 'array', abilities: { str: 0, dex: 0, con: 0, int: 0, wis: 0, cha: 0 },
      skills: [], expertise: [], choice: null, songs: [], vow: '', boosts: {},
      weapon: { type: null, shield: true, keepsake: '', look: '' },
      answers: { dm: false, q1: null, q2: null, q3: null, q4: null },
      look: {
        heightCm: 170, build: '', skin: '', undertone: '', hairColor: '', hairLength: '', hairTexture: '', hairStyle: '',
        eyeColor: '', facialHair: '', glasses: false, marks: '', outfit: '', outfitColors: ['#2c2a3a', '#7d2135', '#d8d3c8'],
        accessories: '', shoes: '', movement: [], voice: '', notes: '', ref: null
      },
      story: { from: '', want: '', fear: '', dieFor: '', worst: '', secret: '', extra: '' },
      comfort: { lines: [], veils: [], notes: '', anonymous: true },
      updated: null
    };
  }

  // Fill in anything missing from an older or partial character.
  function normalize(c) {
    const b = blankCharacter();
    const out = Object.assign(b, c || {});
    for (const k of ['weapon', 'answers', 'look', 'story', 'comfort']) out[k] = Object.assign(blankCharacter()[k], (c && c[k]) || {});
    out.abilities = Object.assign({ str: 0, dex: 0, con: 0, int: 0, wis: 0, cha: 0 }, (c && c.abilities) || {});
    for (const k of ['skills', 'expertise', 'songs']) if (!Array.isArray(out[k])) out[k] = [];
    if (!Array.isArray(out.look.movement)) out.look.movement = [];
    if (!Array.isArray(out.look.outfitColors)) out.look.outfitColors = b.look.outfitColors;
    if (!Array.isArray(out.comfort.lines)) out.comfort.lines = [];
    if (!Array.isArray(out.comfort.veils)) out.comfort.veils = [];
    out.kind = 'stagehand-character';
    return out;
  }

  // What still needs doing before a character is playable. Empty = ready.
  function missing(ch) {
    const out = [];
    const p = find(PATHS, ch.path);
    if (!String(ch.name || '').trim() || !String(ch.player || '').trim()) out.push('you');
    if (!p) out.push('path');
    const vals = ABILITIES.map(a => (ch.abilities || {})[a.id] || 0);
    const arrayOk = vals.every(v => v > 0) && [...vals].sort((a, b) => b - a).join() === STANDARD_ARRAY.join();
    const spent = vals.reduce((s, v) => s + (POINT_BUY.costs[v] != null ? POINT_BUY.costs[v] : 99), 0);
    const buyOk = vals.every(v => v >= 8 && v <= 15) && spent <= POINT_BUY.budget;
    if (!(ch.abilityMethod === 'pointbuy' ? buyOk : arrayOk)) out.push('abilities');
    if (p) {
      const sk = ch.skills || [];
      let ok = sk.length === p.skills.count;
      if (p.expertise && (ch.expertise || []).length !== p.expertise) ok = false;
      if (p.choice && !ch.choice) ok = false;
      if (p.id === 'performer' && (ch.songs || []).length !== songsAllowed(ch.level || 1)) ok = false;
      if (!ok) out.push('skills');
    } else out.push('skills');
    if (!ch.weapon || !ch.weapon.type) out.push('weapon');
    const a = ch.answers || {};
    if (!a.dm && !(a.q1 && a.q2 && a.q3 && a.q4)) out.push('questions');
    return out;
  }

  return {
    ABILITIES, SKILLS, STANDARD_ARRAY, POINT_BUY, MAX_LEVEL, PATHS, WEAPONS, ROLES, KEEPSAKES, QUESTIONS, COMFORT_TOPICS,
    mod, profBonus, sign, find, finalScores, usesCount, songsAllowed, derive, checkModifier, blankCharacter, normalize, missing
  };
});

// can paste into a message. "SH1." + base64url(deflate-raw(JSON)), or "SH0." +
// base64url(JSON) where the browser has no compression. The reference picture
// is left out of codes (it only travels in the saved file).
(function (root, factory) {
  const api = factory();
  if (typeof module === 'object' && module.exports) module.exports = api;
  else root.StagehandCode = api;
})(typeof self !== 'undefined' ? self : globalThis, function () {
  'use strict';
  const KIND = 'stagehand-character';
  const PATTERN = /SH([01])\.([A-Za-z0-9_-]+)/;
  const zlib = (typeof process !== 'undefined' && process.versions && process.versions.node && typeof require === 'function') ? require('zlib') : null;

  function toB64url(bytes) {
    let b64;
    if (typeof Buffer !== 'undefined') b64 = Buffer.from(bytes).toString('base64');
    else { let s = ''; for (let i = 0; i < bytes.length; i += 0x8000) s += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000)); b64 = btoa(s); }

      el('div', { class: 't' }, el('span', { class: 'n', text: x.name }), el('span', { class: 'b', text: `${x.damage} ${x.type}` })), el('div', { class: 'd', text: x.props.join(' · ') }))));
    const out = [el('h2', { text: 'If it came to a fight' }), el('p', { class: 'muted', text: 'Pick the weapon you’d want in your hands.' }), w];

  views[6] = () => {
    const A = ch.answers;
    const out = [
      el('h2', { text: 'Four questions' }),
      el('p', { class: 'muted', text: 'Answer quickly. There are no wrong answers, and nobody else sees them.' }),
      el('div', { class: 'panel' }, chipGroup('dmChoice', [{ id: 'answer', label: 'I’ll answer' }, { id: 'dm', label: 'Let the DM choose for me' }], k => (k === 'dm') === !!A.dm, k => { A.dm = k === 'dm'; }))
    ];
    if (A.dm) { out.push(el('p', { class: 'note', style: 'margin-top:14px', text: 'Your DM will decide. You can come back and answer them any time.' })); return out; }
    R.QUESTIONS.forEach((q, qi) => {
      const g = el('div', { class: 'pick answers', role: 'radiogroup', 'aria-label': q.text });
      q.options.forEach(o => g.append(el('button', { type: 'button', role: 'radio', 'aria-checked': A[q.id] === o.id ? 'true' : 'false', class: 'opt' + (A[q.id] === o.id ? ' on' : ''), onclick: () => { A[q.id] = o.id; save(); render(); } }, el('span', { class: 'n', text: o.text }))));

  };

  const SKIN = ['#f6e1d3', '#f1d0b5', '#e8be9a', '#dda97e', '#c98e5f', '#b87a4b', '#a0653a', '#8a5530', '#6f4325', '#5a361e', '#45281a', '#2f1c13'];

  const ftin = cm => { const inches = Math.round(cm / 2.54); return `${Math.floor(inches / 12)}′ ${inches % 12}″`; };

  views[7] = () => {

    refInput.onchange = e => { const f = e.target.files[0]; if (f) shrink(f).then(url => { L.ref = url; save(); render(); }).catch(() => { $('#refMsg').textContent = 'That picture didn’t load. Try a JPG or PNG.'; }); };
    const colors = el('div', { class: 'sw' });
    L.outfitColors.forEach((c, i) => { const inp = el('input', { type: 'color', id: 'oc' + i, value: c, 'aria-label': `Outfit color ${i + 1}` }); inp.onchange = e => { L.outfitColors[i] = e.target.value; save(); render(); }; colors.append(inp); });

        el('div', { class: 'field' }, el('div', { class: 'lbl', text: 'Hair length' }), chipOne('hairLength', ['Shaved', 'Buzzed', 'Short', 'Chin-length', 'Shoulder-length', 'Long', 'Very long'], 'hairLength')),
        el('div', { class: 'field' }, el('div', { class: 'lbl', text: 'Hair texture' }), chipOne('hairTexture', ['Straight', 'Wavy', 'Curly', 'Coily', 'Locs', 'Braids', 'Twists'], 'hairTexture')),
        field('Hairstyle details', textInput('hairStyle', L.hairStyle, v => (L.hairStyle = v), { placeholder: 'Pinned up, parted in the middle, never tidy…' })),

        field('How you sound', textInput('voice', L.voice, v => (L.voice = v), { placeholder: 'Low and slow, a faint accent, laughs too loud…' })),

  views[8] = () => {

      g.append(el('button', {
        type: 'button', class: 'chip' + (s ? ' ' + s : ''), 'aria-label': `${t}: ${s === 'line' ? 'never' : s === 'veil' ? 'off-screen only' : 'fine'}`,
        onclick: () => {
          if (s === '') C.veils.push(t);
          else if (s === 'veil') { C.veils = C.veils.filter(x => x !== t); C.lines.push(t); }

      el('h2', { text: 'Your limits' }),

    return out;

  let dlPromise = null;
  function getDownloads() {
    if (!dlPromise) dlPromise = (window.claude && typeof window.claude.use === 'function') ? window.claude.use('downloads').catch(() => null) : Promise.resolve(null);
    return dlPromise;
  }

  function sendBox() {
    const box = el('div', { class: 'panel' });
    const ta = el('textarea', { class: 'code', id: 'code', readonly: true, 'aria-label': 'Your code' });
    ta.value = 'Sealing…';
    const status = el('div', { class: 'small', id: 'sendStatus', 'aria-live': 'polite' });
    Code.encode(ch).then(code => { ta.value = code; });
    const copy = el('button', { type: 'button', class: 'btn primary', id: 'copyBtn' }, 'Copy code');
    copy.onclick = () => {
      const code = ta.value;
      const fallback = () => { ta.focus(); ta.select(); status.className = 'small muted'; status.textContent = 'Selected. Press and hold the code, then tap Copy.'; };
      try { navigator.clipboard.writeText(code).then(() => { status.className = 'small ok'; status.textContent = 'Copied. Paste it into a message to your DM.'; }, fallback); }
      catch (e) { fallback(); }
    };
    const file = el('button', { type: 'button', class: 'btn', id: 'fileBtn', hidden: true }, 'Save as a file');
    file.onclick = async () => {
      const dl = await getDownloads();
      if (!dl) { status.className = 'small err'; status.textContent = 'Saving files doesn’t work here. Send the code instead.'; return; }
      const safe = (ch.name || 'character').replace(/[^\w\- ]+/g, '').trim() || 'character';
      try {
        await dl.save({ filename: `${safe}.stagehand.json`, data: JSON.stringify(ch, null, 2) });
        status.className = 'small ok'; status.textContent = 'Saved. Send the file to your DM; it includes your picture.';
      } catch (e) {
        const declined = e && e.code === 'declined';
        status.className = 'small ' + (declined ? 'muted' : 'err');
        status.textContent = declined ? 'Not saved.' : 'That didn’t save. Send the code instead.';
      }
    };
    getDownloads().then(dl => { if (dl) file.hidden = false; });
    [
      el('p', { text: 'Copy this code and text it to your DM. That’s all: your DM pastes it into the game, and your character is waiting for you at the first session.' }),
      ta,
      el('div', { class: 'row', style: 'margin-top:10px' }, copy, file),
      status,
      ch.look.ref ? el('p', { class: 'small muted', style: 'margin:8px 0 0', text: 'Your reference picture is too big for the code. Save the file, or send the picture to your DM separately.' }) : null,
      el('p', { class: 'small muted', style: 'margin:8px 0 0', text: 'Changed your mind about something? Edit it and send the new code.' })
    ].forEach(n => n && box.append(n));
    return box;
  }

  // ------------------------------------------------------------ sheet view
  function sheetView() {
    const d = R.derive(ch, null), p = d.path;
    const out = [];
    out.push(el('div', { class: 'sheet-head' },
      el('div', {}, el('h2', { style: 'margin:8px 0 2px', text: ch.name }), el('div', { class: 'muted small', text: [ch.pronouns, ch.role, p.name, 'Level 1'].filter(Boolean).join(' · ') })),
      el('button', { type: 'button', class: 'btn', onclick: () => { mode = 'build'; step = LAST; save(); render(); } }, 'Edit')));
    out.push(el('div', { class: 'panel' }, el('div', { class: 'vitals' },
      el('div', { class: 'vital' }, el('b', { text: d.hp }), el('span', { text: 'Hit points' })),
      el('div', { class: 'vital' }, el('b', { text: d.ac }), el('span', { text: 'Armor class' })),
      el('div', { class: 'vital' }, el('b', { text: sign(d.initiative) }), el('span', { text: 'Initiative' })),
      el('div', { class: 'vital' }, el('b', { text: `${d.speed} ft` }), el('span', { text: 'Speed' })),
      el('div', { class: 'vital' }, el('b', { text: sign(d.prof) }), el('span', { text: 'Proficiency' })),
      el('div', { class: 'vital' }, el('b', { text: d.passivePerception }), el('span', { text: 'Passive perception' })))));
    const w = d.weapon;
    out.push(el('h3', { text: 'Weapon' }), el('div', { class: 'panel' },
      el('div', { class: 'li' }, el('span', { class: 'k', text: w.name }), el('span', { class: 'v', text: `${sign(d.attack.bonus)} · ${d.attack.damage}` })),
      el('div', { class: 'small muted', style: 'margin-top:6px', text: w.props.join(' · ') + (d.shield ? ' · Shield +2 AC' : '') }),
      ch.weapon.keepsake ? el('div', { class: 'small', style: 'margin-top:6px', text: `Always on you: ${ch.weapon.keepsake.toLowerCase()}.` }) : null));
    const grid = el('div', { class: 'abgrid' });
    for (const a of R.ABILITIES) grid.append(el('div', { class: 'ab' }, el('div', { class: 's', text: a.short }), el('div', { class: 'm', text: sign(d.mods[a.id]) }), el('div', { class: 'v' }, `${d.scores[a.id]} · `, el('span', { class: 'sv' + (p.saves.includes(a.id) ? ' prof' : ''), title: p.saves.includes(a.id) ? 'Proficient save' : null, text: `save ${sign(d.saveMods[a.id])}` }))));
    out.push(el('h3', { text: 'Abilities' }), el('div', { class: 'panel' }, grid));
    const sl = el('div', {});
    for (const s of R.SKILLS) sl.append(el('div', { class: 'li' + (ch.skills.includes(s.id) ? ' prof' : '') }, el('span', { class: 'k', text: `${s.name}${ch.expertise.includes(s.id) ? ' (expert)' : ''}` }), el('span', { class: 'v', text: sign(d.skillMods[s.id]) })));
    out.push(el('h3', { text: 'Skills' }), el('div', { class: 'panel' }, sl));
    const fl = el('div', {});
    for (const f of p.features.filter(x => x.level <= 1)) {
      let text = f.text;
      if (f.name === 'Fighting Style' && ch.choice) { const o = p.choice.options.find(x => x.id === ch.choice); if (o) text = `${o.name}: ${o.text}`; }
      if (f.name === 'Vow' && ch.vow) text = `“${ch.vow}” ${f.text}`;
      const n = f.uses ? R.usesCount(f.uses, ch, d.scores) : 0;
      fl.append(el('div', { class: 'feat' }, el('div', { class: 'h' }, el('b', { text: f.name }), el('span', { class: 'lv', text: n ? `${n} per ${f.per} rest` : (f.pool ? `${R.usesCount(f.pool, ch, d.scores)} HP per long rest` : '') })), el('p', { text })));
    }
    out.push(el('h3', { text: `${p.name} features` }), el('div', { class: 'panel' }, fl, el('p', { class: 'small muted', style: 'margin:10px 0 0', text: 'More arrive as you level up.' })));
    if (p.workings) {
      const wl = el('div', {});
      const known = p.workings.all ? p.workings.list.filter(x => x.level <= 1) : p.workings.list.filter(x => x.cost === 0 || ch.songs.includes(x.id));
      for (const x of known) wl.append(el('div', { class: 'feat' }, el('div', { class: 'h' }, el('b', { text: x.name }), el('span', { class: 'lv', text: x.cost ? `${x.cost} pt${x.cost > 1 ? 's' : ''}` : 'Free' })), el('p', { text: x.text })));
      out.push(el('h3', { text: p.workings.label }), el('div', { class: 'panel' }, wl, el('p', { class: 'small muted', style: 'margin:10px 0 0', text: `${d.points.name}: ${d.points.max} per long rest · ${p.power.label} ${d.powerDC} · attack ${sign(d.powerAttack)}` })));
    }

    out.push(el('details', { class: 'more' }, el('summary', { text: 'Open a different code' }), restoreBox()));
    return out;
  }

  function restoreBox() {
    const ta = el('textarea', { id: 'restore', class: 'code', placeholder: 'Paste a code that starts with SH' });
    const msg = el('div', { class: 'small', 'aria-live': 'polite' });
    const btn = el('button', { type: 'button', class: 'btn', onclick: async () => {
      try { ch = R.normalize(await Code.readAny(ta.value)); mode = 'sheet'; save(); render(); window.scrollTo({ top: 0 }); }
      catch (e) { msg.className = 'small err'; msg.textContent = 'That code didn’t open. Check that you copied all of it.'; }
    } }, 'Open this code');
    return el('div', { class: 'panel' }, ta, el('div', { class: 'row', style: 'margin-top:8px' }, btn), msg);
  }

  function shrink(f) {
    return new Promise((resolve, reject) => {
      const img = new Image();
      img.onload = () => {
        const max = 768, k = Math.min(1, max / Math.max(img.width, img.height));
        const c = document.createElement('canvas'); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        URL.revokeObjectURL(img.src);
        resolve(c.toDataURL('image/jpeg', 0.82));
      };
      img.onerror = reject;
      img.src = URL.createObjectURL(f);
    });
  }

  // ------------------------------------------------------------ render
  function render() {
    const app = $('#app');
    app.innerHTML = '';
    if (mode === 'sheet' && allValid()) sheetView().forEach(n => n && app.append(n));
    else { mode = 'build'; (views[step] || views[0])().forEach(n => n && app.append(n)); }
    renderSteps(); renderNav();
  }
  load();
  render();
})();
